          (character) =>

              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character]

      function commitHeader(commit) {
        const scopePart = commit.scope ? `(${commit.scope})` : "";
        return `${commit.type}${scopePart}: ${commit.subject}`;
      }

      function messageTail(commit) {
        return [commit.body, commit.footers.join("\n")]
          .filter(Boolean)
          .join("\n\n");

      function fullMessage(commit) {
        return [commitHeader(commit), messageTail(commit)]
          .filter(Boolean)

      function messagePath(position) {
        return `${PLAN_DIRECTORY}/msg-${String(position).padStart(2, "0")}.txt`;
      }

      function continuedCommand(prefix, items, suffix = "") {
        const ending = suffix ? ` ${suffix}` : "";
        if (items.length === 1) return `${prefix} ${items[0]}${ending}`;
        return [
          `${prefix} \\`,
          ...items.map(
            (item, index) =>
              `  ${item}${index < items.length - 1 ? " \\" : ending}`
          ),
        ].join("\n");
      }

      function addCommand(paths) {
        return continuedCommand("git add -A --", paths);
      }

      function quoteForShell(text) {
        return `'${text}'`;
      }

      function ignoreCommands(plan, position) {
        const quotedPatterns = plan.ignore.rules.map((rule) =>
          quoteForShell(rule.pattern)
        );
        if (!plan.gitignoreEndsWithNewline) quotedPatterns.unshift("''");
        const lines = [
          continuedCommand("printf '%s\\n'", quotedPatterns, ">> .gitignore"),
        ];
        if (plan.ignore.untrack.length)
          lines.push(
            continuedCommand(
              "git rm -r --cached --quiet --",
              plan.ignore.untrack
            )
          );
        lines.push("git add .gitignore");
        lines.push(`git commit -F ${messagePath(position)}`);
        return lines.join("\n");

      function ignoreCommit(plan) {

          scope: null,

              deleted: 0,

          ],
          ignoreRules: plan.ignore.rules,
          untrack: plan.ignore.untrack,
        };

      function plannedCommits(plan) {
        return plan.ignore
          ? [ignoreCommit(plan), ...plan.commits]
          : plan.commits;
      }

      function commitCommands(commit, position) {
        const wholeFilePaths = commit.files
          .filter((file) => !file.partial)
          .map((file) => file.path);
        const lines = [];
        if (wholeFilePaths.length) lines.push(addCommand(wholeFilePaths));
        if (commit.patch)

        }));
        if (plan.indexHadStagedChanges)
          entries.unshift({ kind: "prep", commands: unstageCommand });
        return entries;
      }

      function allCommands(plan) {
        return planEntries(plan)
          .map((entry) => entry.commands)
          .join("\n");
      }

      function highlightCommands(commands) {
        return commands
          .split("\n")
          .map((line) =>
            !line.startsWith(" ")
              ? `<span class="command-prompt">$ </span>${escapeHtml(line)}`
              : `  ${escapeHtml(line)}`
          )
          .join("\n");
      }

      function commandBlock(commands, entryKey) {
        return `<div class="command-block">
          <pre>${highlightCommands(commands)}</pre>
          <button class="copy-button" data-copy="${escapeHtml(commands)}" data-entry="${entryKey}">Copy</button>
        </div>`;
      }

      function fileList(files) {
        const rows = files
          .map(
            (file) => `<li>
              <span>${file.status}</span>
              <span><span class="file-path">${escapeHtml(file.path)}</span>${file.partial ? ' <span class="partial-note">some changes only</span>' : ""}</span>
              <span><span class="count-added">+${file.added}</span>${file.deleted ? `<span class="count-deleted">−${file.deleted}</span>` : ""}</span>
            </li>`
          )
          .join("");
        return `<ul class="file-list">${rows}</ul>`;
      }

      function baseEntry(plan) {
        return `<li class="graph-entry">
          <span class="node node-base" aria-hidden="true"></span>
          <p class="entry-meta"><span>Current commit</span><span class="mono">${plan.base}</span></p>
          <p class="entry-header secondary">${escapeHtml(plan.baseSubject)}</p>
        </li>`;
      }

      function prepEntry(entry, entryKey) {
        return `<li class="graph-entry type-prep ${copiedEntries.has(entryKey) ? "copied" : ""}" data-entry="${entryKey}">
          <span class="node" aria-hidden="true"></span>
          <p class="entry-meta"><span>Before you start</span></p>
          <p class="entry-header">Unstage what's already staged</p>
          <p class="entry-reason secondary">Some changes were already staged. This clears the staging area so each commit takes exactly the files listed. Your files on disk don't change.</p>
          ${commandBlock(entry.commands, entryKey)}
        </li>`;
      }

      function commitEntry(entry, entryKey) {
        const { commit, position } = entry;
        const tail = messageTail(commit);
        return `<li class="graph-entry type-${commit.type} ${copiedEntries.has(entryKey) ? "copied" : ""}" data-entry="${entryKey}">
          <span class="node" aria-hidden="true"></span>
          <p class="entry-meta"><span>Commit ${position} of ${plannedCommits(samplePlan).length}</span></p>
          <h2 class="entry-header"><span class="type-word">${commit.type}</span>${escapeHtml(commitHeader(commit).slice(commit.type.length))}</h2>
          ${tail ? `<p class="entry-body">${escapeHtml(tail)}</p>` : ""}
          <p class="entry-reason">${escapeHtml(commit.rationale)}</p>
          ${commit.ignoreRules ? ignoreRuleList(commit) : fileList(commit.files)}
          ${commandBlock(entry.commands, entryKey)}
          <details class="disclosure">
            <summary>Message only, for a Git app</summary>
            ${commandBlockForMessage(commit)}
          </details>
        </li>`;
      }

      function hiddenFilesNote(rule) {
        const onlyHidesItself =
          rule.hides.length === 1 && rule.hides[0] === rule.pattern;
        return onlyHidesItself
          ? ""
          : `, hides ${rule.hides.map(escapeHtml).join(", ")}`;
      }

      function ignoreRuleList(commit) {
        const rows = commit.ignoreRules
          .map(
            (rule) => `<li>
              <span>+</span>
              <span><span class="file-path">${escapeHtml(rule.pattern)}</span> <span class="rule-reason">${escapeHtml(rule.reason)}${hiddenFilesNote(rule)}</span>${commit.untrack.includes(rule.pattern) ? ' <span class="partial-note rule-reason">kept on disk, removed from Git</span>' : ""}</span>
              <span></span>
            </li>`
          )
          .join("");
        return `<p class="list-caption">Added to .gitignore</p><ul class="file-list">${rows}</ul>`;
      }

      function commandBlockForMessage(commit) {
        const message = fullMessage(commit);
        return `<div class="command-block">
          <pre>${escapeHtml(message)}</pre>
          <button class="copy-button" data-copy="${escapeHtml(message)}">Copy</button>
        </div>`;
      }

      function endEntry() {
        return `<li class="graph-entry">
          <span class="node node-end" aria-hidden="true"></span>
          <p class="entry-header">Working tree clean</p>
          <p class="entry-reason secondary">After the last commit, <span class="mono">git status</span> shows nothing to commit.</p>
        </li>`;
      }

      function renderGraph(plan) {
        const entries = planEntries(plan);
        const entryMarkup = entries
          .map((entry, index) =>
            entry.kind === "prep"
              ? prepEntry(entry, index)
              : commitEntry(entry, index)
          )
          .join("");
        const graph = document.getElementById("graph");
        graph.innerHTML = baseEntry(plan) + entryMarkup + endEntry();
        graph.classList.toggle(
          "complete",
          copiedEntries.size === entries.length
        );
      }

      function renderHeader(plan) {
        const count = plannedCommits(plan).length;
        document.getElementById("page-title").textContent =
          `${count} commits for ${plan.repository}`;
        document.getElementById("page-summary").textContent =
          `Run these in order on ${plan.branch}. Nothing has been staged or committed yet; this page only shows the commands.`;
      }

      function renderProgress(plan) {
        const total = planEntries(plan).length;
        const copiedCount = copiedEntries.size;
        document.getElementById("progress-text").textContent =
          copiedCount === 0
            ? `${total} steps to run`
            : `${copiedCount} of ${total} steps copied`;
      }

      function renderLeftOut(plan) {
        const leftOut = document.getElementById("left-out");
        leftOut.hidden = plan.excluded.length === 0;
        const items = plan.excluded
          .map(
            (item) =>
              `<li><span class="mono">${escapeHtml(item.path)}</span> ${escapeHtml(item.reason)}</li>`
          )
          .join("");
        leftOut.innerHTML = `<h2>Left out</h2><ul>${items}</ul>`;
      }

      function renderPage(plan) {
        renderHeader(plan);
        renderGraph(plan);
        renderProgress(plan);
        renderLeftOut(plan);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const scratch = document.createElement("textarea");
          scratch.value = text;
          document.body.append(scratch);
          scratch.select();
          document.execCommand("copy");
          scratch.remove();
        }
      }

      function confirmCopy(button) {
        const label = button.textContent;
        button.textContent = "Copied";
        button.classList.add("just-copied");
        setTimeout(() => {
          button.textContent = label;
          button.classList.remove("just-copied");
        }, 1400);
      }

      function markEntryCopied(entryKey) {
        copiedEntries.add(Number(entryKey));
        document
          .querySelector(`.graph-entry[data-entry="${entryKey}"]`)
          .classList.add("copied");
        document
          .getElementById("graph")
          .classList.toggle(
            "complete",
            copiedEntries.size === planEntries(samplePlan).length
          );
        renderProgress(samplePlan);
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest(".copy-button");
        if (!button) return;
        await copyText(button.dataset.copy);
        confirmCopy(button);
        if (button.dataset.entry !== undefined)
          markEntryCopied(button.dataset.entry);
      });

      document
        .getElementById("copy-all")
        .addEventListener("click", async (event) => {
          await copyText(allCommands(samplePlan));
          confirmCopy(event.currentTarget);
          planEntries(samplePlan).forEach((entry, index) =>
            markEntryCopied(index)
          );
        });

      document.getElementById("toggle-theme").addEventListener("click", () => {
        const root = document.documentElement;
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = root.dataset.theme
          ? root.dataset.theme === "dark"
          : prefersDark;
        root.dataset.theme = isDark ? "light" : "dark";
      });

      renderPage(samplePlan);
    </script>
  </body>
</html>
